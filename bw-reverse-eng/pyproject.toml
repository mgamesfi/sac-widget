[project]
name = "bw-reveng"
version = "0.1.0"
description = "Engenharia reversa de metadados SAP BW 7.5 on HANA: extração, lineage e documentação"
requires-python = ">=3.10"
dependencies = [
    "hdbcli>=2.19",
    "networkx>=3.0",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
rfc = ["pyrfc>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
bw-reveng = "cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["extractor*", "processor*", "docgen*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["."]
